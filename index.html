<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <link rel="stylesheet" href="styles.css">
  
  <title>Frontend Mentor | Social links profile</title>

</head>
<body>
  <main>

    <section class="user-info">
      <img
        class="user-info__avatar"
        src="assets/images/avatar-jessica.jpeg" 
        alt="Avatar of the User"
      >
      <h1 class="user-info__name">Jessica Randall</h1>
      <h2 class="user-info__location">London, United Kingdom</h2>
      <p class="user-info__about">"Front-end developer and avid reader."</p>
    </section>

    <section class="social-net">
      <a class="social-net__button" target="_blank" href="https://github.com/PablinViking">GitHub</a>
      <a class="social-net__button" target="_blank" href="https://www.frontendmentor.io/profile/PablinViking">Frontend Mentor</a>
      <a class="social-net__button" target="_blank" href="#">LinkedIn</a>
      <a class="social-net__button" target="_blank" href="#">Twitter</a>
      <a class="social-net__button" target="_blank" href="https://www.instagram.com/pabloboichenko/">Instagram</a>
    </section>

  </main>
  
  <footer class="attribution">
    <p class="attribution__p">
      Challenge by <a class="attribution__a" target="_blank" href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a class="attribution__a" target="_blank" href="https://github.com/PablinViking">Pablo Boichenko</a>.
    </p>
  </footer>

</body>
</html>
